[package]
name = "scion-path-visualiser"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "scion_path_visualiser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "^2.0.0-rc", features = ["derive", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
specta-typescript = "^0.0.7"
tauri-specta = { version = "^2.0.0-rc", features = ["derive", "typescript"] }
scion-proto = "0.5.2"
glob = "0.3"
tauri-plugin-store = "2"
tokio = { version = "1", features = ["process", "io-util"] }
tauri-plugin-log = "2"
anyhow = "1.0.102"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
scionpings = { git = "https://github.com/jeltevanbommel/scion-ehapi-bridge.git", version = "0.1.0" }
scion-sdk-observability = "0.5.2"
tokio-util = "0.7.18"
url = "2.5.8"
tracing = "0.1.44"
scion-stack = "0.5.2"
endhost-api-client = "0.5.2"
scion-sdk-reqwest-connect-rpc = "0.5.2"
rustls = "0.23.40"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"

